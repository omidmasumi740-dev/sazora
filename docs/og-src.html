<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Vazirmatn';
    src: url('assets/fonts/vazirmatn-regular.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Vazirmatn';
    src: url('assets/fonts/vazirmatn-bold.woff2') format('woff2');
    font-weight: 700;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Vazirmatn', sans-serif;
    background: #0b0d10;
    color: #f4f6f9;
    position: relative;
    padding: 58px 70px 54px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 80% at 82% 0%, rgba(255,140,0,.28), transparent 65%),
      radial-gradient(ellipse 40% 55% at 4% 100%, rgba(255,179,71,.12), transparent 70%);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 28px 28px;
    mask-image: linear-gradient(180deg, #000, transparent 80%);
  }
  .row { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { width: 64px; height: 64px; filter: drop-shadow(0 0 24px rgba(255,140,0,.45)); }
  .brand b { font-family: Inter, sans-serif; font-size: 30px; letter-spacing: .14em; font-weight: 600; }
  .badge {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid rgba(255,140,0,.32);
    background: rgba(255,140,0,.1);
    color: #ffb347; font-size: 19px; padding: 10px 20px; border-radius: 999px;
  }
  .badge i { width: 9px; height: 9px; border-radius: 50%; background: #ff8c00; box-shadow: 0 0 0 5px rgba(255,140,0,.14); }
  .hero { position: relative; padding-block: 22px 8px; }
  h1 { font-size: 68px; line-height: 1.32; font-weight: 700; letter-spacing: -.02em; }
  .grad { background: linear-gradient(110deg, #ffb347, #ff8c00); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 18px; font-size: 25px; color: #9aa4b2; line-height: 1.7; }
  .bottom { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .chips { display: flex; gap: 12px; }
  .chips span {
    border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.04);
    color: #c7ced8; font-size: 17px; padding: 9px 18px; border-radius: 10px;
  }
  .url { font-family: Inter, sans-serif; font-size: 18px; color: #6b7688; letter-spacing: .02em; direction: ltr; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="dots"></div>
  <div class="row">
    <div class="brand"><img src="assets/img/logo.svg" alt=""><b>SAZORA</b></div>
    <div class="badge"><i></i> نسخهٔ ۱٫۹٫۱۷</div>
  </div>
  <div class="hero">
    <h1>همهٔ کارهایت، در یک جای<br>آرام و <span class="grad">آفلاین.</span></h1>
    <p>کار، پروژهٔ ساختمانی، کارگر، مالی، هدف و کتاب — یک اپ ویندوز، بدون اینترنت.</p>
  </div>
  <div class="bottom">
    <div class="chips"><span>Windows 10/11</span><span>آفلاین و خصوصی</span><span>فارسی و راست‌چین</span></div>
    <div class="url">omidmasumi740-dev.github.io/sazora</div>
  </div>
</body>
</html>
